<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Club Night</title>

</head>
<body>
<h1> Book Club Picker</h1>

<main>
    <section>
        <h3> Press the randomize button and let it pick something for you!</h3>
        <div class="select_button" id="_button">
            <form action="/random/" method="post">
                <label for="myinput">{{book if book else "Select something"}}</label>
                <br>
                <button name="selectBtn" id="myinput" type="submit">Randomize</button>
            </form>
        </div>
    </section>
    <hr>
    <section>
        <p><b> Want to add a book? </b></p>
        <form action="/add/" method="post">
            <label>Book name: <input type="text" name="name" required></label>
            <br><br>
            <label>Author name: <input type="text" name="author" required></label>
            <br><br>
            <label>Year: <input type="text" name="year" required></label>
            <br><br>
            <label>Page Count: <input type="text" name="pages" required></label>
            <br><br>
            <button type="submit">Add a book</button>
        </form>
    </section>
    <hr>
</main>
<footer>
    <p>All rights reserved &#xA9; 2026 Silly Devious Media </p>
</footer>
</body>
</html>
