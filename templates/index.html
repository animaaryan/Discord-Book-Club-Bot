<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Book Club</title>
    <link href="/static/css/styles.css" rel="stylesheet"/>
</head>
<body>
<main>
    <div class="book-club">
        <h1> Book Club Picker</h1>
        <hr>
        <section>
            <h2> Press the randomize button and let it pick something for you!</h2>
            <div class="select_button" id="_button"></div>
        </section>
        <section>
            <p class="to-add"><b> Want to add a book? </b></p>
            <form action="/add/" method="post">
                <div class="form-grid">
                    <label for="name"> Book name: </label>
                    <input type="text" id="name" name="name" required></label>

                    <label for="author"> Author name:</label>
                    <input type="text" name="author" id="author" required></label>

                    <label for="year"> Year:</label>
                    <input type="number" name="year" id="year"></label>

                    <label for="pages"> Page Count:</label>
                    <input type="number" name="pages" id="pages"></label>
                </div>
                <div class="button-row">
                    <button type="submit" id="submit-btn">Add a book</button>
                    <button type="submit" form="random-form" name="selectBtn" id="randomize-btn">Randomize</button>
                </div>
            </form>
        </section>
        <section>
            <form id="random-form" action="/random/" method="post">
                <br>
                <label for="myinput" style="color: white;">{{book if book else "Book shows up here"}}</label>
                <br>
            </form>
            </form>
        </section>
        <hr>
    </div>
</main>
<footer>
    <p>All rights reserved &#xA9; 2026 Silly Devious Media </p>
</footer>
</body>
</html>
